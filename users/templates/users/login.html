<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    overflow:hidden;

    background:
        radial-gradient(circle at top left, rgba(99,102,241,0.25), transparent 30%),
        radial-gradient(circle at bottom right, rgba(59,130,246,0.18), transparent 30%),
        #0f172a;

    position:relative;
}

/* ===== BACKGROUND GLOW ===== */

body::before,
body::after{
    content:"";
    position:absolute;

    width:350px;
    height:350px;

    border-radius:50%;

    filter:blur(80px);

    z-index:0;
}

body::before{
    top:-100px;
    left:-100px;

    background:rgba(99,102,241,0.28);
}

body::after{
    bottom:-120px;
    right:-100px;

    background:rgba(59,130,246,0.22);
}

/* ===== LOGIN CARD ===== */

.container{
    position:relative;
    z-index:1;

    width:100%;
    max-width:430px;

    padding:42px;

    border-radius:30px;

    background:rgba(255,255,255,0.08);

    border:1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(22px);

    box-shadow:
        0 20px 50px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.08);

    overflow:hidden;
}

.container::before{
    content:"";
    position:absolute;
    inset:0;

    background:linear-gradient(
        135deg,
        rgba(255,255,255,0.08),
        transparent
    );

    pointer-events:none;
}

/* ===== BRAND ===== */

.brand{
    text-align:center;
    margin-bottom:35px;
}

.brand-logo{
    width:72px;
    height:72px;

    margin:auto auto 18px auto;

    border-radius:22px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:32px;

    background:linear-gradient(135deg,#3b82f6,#8b5cf6);

    box-shadow:
        0 12px 24px rgba(59,130,246,0.35);
}

.brand h2{
    font-size:34px;
    font-weight:800;

    margin-bottom:10px;

    color:white;
}

.brand h2 span{
    background:linear-gradient(to right,#60a5fa,#a78bfa);

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.brand p{
    color:#94a3b8;
    font-size:15px;
    line-height:1.6;
}

/* ===== DJANGO FORM STYLING ===== */

form{
    width:100%;
}

form p{
    margin-bottom:20px;
}

label{
    display:block;

    margin-bottom:10px;

    color:#cbd5e1;
    font-size:14px;
    font-weight:600;
}

/* ===== INPUTS ===== */

input{
    width:100%;

    padding:15px 16px;

    border-radius:16px;

    border:1px solid rgba(255,255,255,0.08);

    background:rgba(15,23,42,0.7);

    color:white;

    font-size:15px;

    transition:all .25s ease;
}

input::placeholder{
    color:#64748b;
}

input:focus{
    outline:none;

    border-color:rgba(96,165,250,0.5);

    box-shadow:
        0 0 0 4px rgba(59,130,246,0.15);

    background:rgba(15,23,42,0.9);
}

/* ===== BUTTON ===== */

button{
    width:100%;

    margin-top:10px;

    padding:16px;

    border:none;
    border-radius:18px;

    font-size:16px;
    font-weight:700;

    color:white;

    cursor:pointer;

    background:linear-gradient(135deg,#3b82f6,#6366f1);

    transition:all .3s ease;

    box-shadow:
        0 12px 24px rgba(59,130,246,0.28);
}

button:hover{
    transform:translateY(-4px);

    box-shadow:
        0 18px 35px rgba(59,130,246,0.4),
        0 0 20px rgba(99,102,241,0.25);
}

/* ===== FOOTER ===== */

.footer-text{
    text-align:center;

    margin-top:24px;

    color:#94a3b8;
    font-size:14px;
}

.footer-text a{
    color:#60a5fa;
    text-decoration:none;
    font-weight:600;

    transition:0.2s;
}

.footer-text a:hover{
    color:#93c5fd;
}

/* ===== MOBILE ===== */

@media(max-width:520px){

    .container{
        padding:30px 24px;
        border-radius:24px;
    }

    .brand h2{
        font-size:28px;
    }

    .brand-logo{
        width:64px;
        height:64px;
        font-size:28px;
    }
}

</style>
</head>

<body>

<div class="container">

    <!-- ===== BRAND ===== -->

    <div class="brand">

        <div class="brand-logo">
            🚘
        </div>

        <h2>
            Welcome <span>Back</span>
        </h2>

        <p>
            Log in to continue your ride-sharing journey with Carpool Connect.
        </p>

    </div>

    <!-- ===== LOGIN FORM ===== -->

    <form method="POST" action="{% url 'users:login' %}">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Login
        </button>

    </form>

    <!-- ===== FOOTER ===== -->

    <div class="footer-text">

        Don't have an account?

        <a href="{% url 'users:register' %}">
            Register
        </a>

    </div>
    <div class="footer-text">
        Or
        {% load socialaccount %}
        <a href="/accounts/google/login/">Continue with Google</a>
    </div>

</div>

</body>
</html>
